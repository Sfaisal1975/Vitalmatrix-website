<!-- LA-3: FLINT Five-Layer Architecture Section -->
<style>
#vm-la3-root{--vm-prussian:#0D2B4E;--vm-gold:#C9A84C;--vm-teal:#1A7A8A;--vm-purple:#7B5EA7;--vm-sage:#5F7C6C;--vm-white:#F4F4F2;--vm-charcoal:#1A2030;--vm-deep-teal:#0C4452;--vm-z1:#C9A84C;--vm-z2:#1A7A8A;--vm-z3:#7B5EA7;--vm-z4:#5F7C6C;--vm-z5:#2E6DB4;--vm-danger:#C0392B;--vm-muted:rgba(244,244,242,0.55);--vm-card-bg:rgba(255,255,255,0.06);--vm-card-border:rgba(255,255,255,0.11);background:var(--vm-deep-teal);color:var(--vm-white);padding:64px 24px;font-family:'Outfit',sans-serif}
#vm-la3-root *,#vm-la3-root *::before{box-sizing:border-box;margin:0;padding:0}
#vm-la3-root .la3-ey{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--vm-gold);margin-bottom:8px}
#vm-la3-root h2{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--vm-white);margin-bottom:10px;line-height:1.15}
#vm-la3-root .la3-sub{font-size:14px;color:var(--vm-muted);line-height:1.6;max-width:620px;margin-bottom:32px}
#vm-la3-root .la3-ly{border-radius:10px;border:1px solid var(--vm-card-border);background:rgba(255,255,255,0.02);overflow:hidden;transition:background .3s}
#vm-la3-root .la3-ly.open{background:var(--vm-card-bg)}
#vm-la3-root .la3-hd{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;user-select:none;border-bottom:1px solid transparent}
#vm-la3-root .la3-ly.open .la3-hd{border-bottom-color:var(--vm-card-border)}
#vm-la3-root .la3-bg{width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:700;font-size:14px;border:2px solid;transition:all .3s}
#vm-la3-root .la3-tt{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--vm-white)}
#vm-la3-root .la3-q{font-size:12px;font-weight:600;margin-top:2px}
#vm-la3-root .la3-ch{font-size:18px;transition:transform .3s;margin-left:auto}
#vm-la3-root .la3-ly.open .la3-ch{transform:rotate(180deg)}
#vm-la3-root .la3-ct{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .3s}
#vm-la3-root .la3-ly.open .la3-ct{max-height:2000px;opacity:1}
#vm-la3-root .la3-in{padding:16px 20px 20px}
#vm-la3-root .la3-ar{display:flex;flex-direction:column;align-items:center;padding:6px 0;opacity:.6}
#vm-la3-root .la3-al{width:2px;height:20px;background:var(--vm-gold)}
#vm-la3-root .la3-ah{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--vm-gold)}
#vm-la3-root .la3-at{font-size:9px;color:var(--vm-muted);font-family:'DM Mono',monospace;margin-top:2px}
#vm-la3-root .la3-nds{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:20px}
#vm-la3-root .la3-nd{display:flex;flex-direction:column;align-items:center;width:90px}
#vm-la3-root .la3-nc{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:var(--vm-white)}
#vm-la3-root .la3-nc.n6{box-shadow:0 0 12px rgba(26,122,138,0.5)}
#vm-la3-root .la3-nn{font-size:11px;text-align:center;margin-top:6px;line-height:1.3;font-weight:600}
#vm-la3-root .la3-zb{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-family:'DM Mono',monospace;font-weight:600;color:#fff;margin:3px 3px 0 0}
#vm-la3-root .la3-p2{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-family:'DM Mono',monospace;font-weight:700;color:var(--vm-prussian);background:var(--vm-gold)}
#vm-la3-root .la3-n6n{font-size:9px;color:var(--vm-muted);text-align:center;margin-top:4px;line-height:1.3}
#vm-la3-root .la3-mb{padding:10px 16px;border-radius:8px;border:1px solid var(--vm-card-border);background:rgba(255,255,255,0.04);text-align:center}
#vm-la3-root .la3-mt{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--vm-muted)}
#vm-la3-root .la3-ms{font-size:11px;color:var(--vm-muted);margin-top:4px;font-weight:600}
#vm-la3-root .la3-zs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#vm-la3-root .la3-zc{flex:1 1 170px;max-width:220px;border-radius:0 8px 8px 0;padding:12px 14px}
#vm-la3-root .la3-zi{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;margin-bottom:4px}
#vm-la3-root .la3-zn{font-size:11px;margin-bottom:4px}
#vm-la3-root .la3-zt{font-family:'DM Mono',monospace;font-size:10px;color:var(--vm-muted);margin-bottom:4px}
#vm-la3-root .la3-zst{font-size:10px;color:var(--vm-muted)}
#vm-la3-root .la3-z5n{font-size:9px;color:var(--vm-gold);margin-top:6px;font-style:italic}
#vm-la3-root .la3-ss{display:flex;flex-direction:column;gap:10px}
#vm-la3-root .la3-sr{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--vm-card-border)}
#vm-la3-root .la3-sr.s4{border-color:rgba(192,57,43,0.25)}
#vm-la3-root .la3-si{font-family:'DM Mono',monospace;font-weight:700;font-size:13px;flex-shrink:0;width:28px}
#vm-la3-root .la3-sd{display:flex;align-items:center;gap:4px;flex-shrink:0;font-family:'DM Mono',monospace;font-size:12px;font-weight:700}
#vm-la3-root .la3-sa{font-size:14px;color:var(--vm-gold)}
#vm-la3-root .la3-sx{flex:1}
#vm-la3-root .la3-sh{font-size:12px;margin-bottom:4px}
#vm-la3-root .la3-tb{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-family:'DM Mono',monospace;font-weight:700;margin-right:6px}
#vm-la3-root .la3-ub{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-family:'DM Mono',monospace;font-weight:700;color:#fff;background:var(--vm-teal)}
#vm-la3-root .la3-sn{font-size:10px;color:var(--vm-muted);margin-top:4px;font-style:italic}
#vm-la3-root .la3-tl{margin-top:16px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--vm-gold);background:rgba(201,168,76,0.07)}
#vm-la3-root .la3-tlh{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--vm-gold);margin-bottom:8px}
#vm-la3-root .la3-tp{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 0;margin-bottom:8px}
#vm-la3-root .la3-tz{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid}
#vm-la3-root .la3-ta{color:var(--vm-gold);font-size:16px}
#vm-la3-root .la3-dp{padding:16px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--vm-card-border)}
#vm-la3-root .la3-dp p{font-size:13px;line-height:1.6;margin-bottom:10px}
#vm-la3-root .la3-dc{padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:8px}
#vm-la3-root .la3-ao{display:flex;flex-direction:column;gap:8px}
#vm-la3-root .la3-arow{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--vm-card-border)}
#vm-la3-root .la3-an{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--vm-sage);flex-shrink:0;min-width:120px}
#vm-la3-root .la3-ad{font-size:12px}
#vm-la3-root .la3-cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:20px}
#vm-la3-root .la3-cc{padding:10px 12px;border-radius:8px;text-align:center;border:1px solid}
#vm-la3-root .la3-cv{font-family:'DM Mono',monospace;font-size:20px;font-weight:700}
#vm-la3-root .la3-cl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;margin-bottom:2px}
#vm-la3-root .la3-cn{font-size:10px;color:var(--vm-muted)}
.vm-reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.vm-reveal.revealed{opacity:1;transform:translateY(0)}
</style>
<section id="vm-la3-root" class="vm-reveal"><div style="max-width:820px;margin:0 auto">
  <div class="la3-ey">Layer by Layer</div>
  <h2>The FLINT Five-Layer Architecture</h2>
  <p class="la3-sub">Five clinical questions answered in sequence. Each layer feeds the next. Click any layer to expand its detail view.</p>
  <div id="vm-la3-layers"></div>
  <div class="la3-cg" id="vm-la3-constants"></div>
</div></section>
<script>
(function(){
  var ZC={Z1:'#C9A84C',Z2:'#1A7A8A',Z3:'#7B5EA7',Z4:'#5F7C6C',Z5:'#2E6DB4'},
      LC=['#1A7A8A','#1A7A8A','#C9A84C','#7B5EA7','#5F7C6C'],
      layers=[
        {id:'L1',title:'Layer 1: Node Scoring',q:'WHERE is the functional load?'},
        {id:'L2',title:'Layer 2: Zone Activation (NCZ)',q:'WHICH systems are burdened?'},
        {id:'L3',title:'Layer 3: Cascade Detection (CascadeIQ)',q:'HOW are the zones affecting each other?'},
        {id:'L4',title:'Layer 4: Causality Intelligence (DRD)',q:'WHO started it?'},
        {id:'L5',title:'Layer 5: Examination Intelligence (APEX)',q:'WHAT does the practitioner see?'}
      ],
      nodes=[{id:'N1',nm:'Assimilation',z:['Z2']},{id:'N2',nm:'Defence and Repair',z:['Z2','Z4']},{id:'N3',nm:'Energy',z:['Z1','Z5']},{id:'N4',nm:'Biotransformation and Elimination',z:['Z4','Z5']},{id:'N5',nm:'Transport',z:['Z3']},{id:'N6',nm:'Communication',z:['Z1','Z2','Z3','Z5']},{id:'N7',nm:'Structural Integrity',z:[]}],
      zones=[{id:'Z1',nm:'Metabolic Energy Axis',nd:'N3 + N6',t:40},{id:'Z2',nm:'Resilience Network',nd:'N1 + N2 + N6',t:40},{id:'Z3',nm:'Cardiovascular-Neural Axis',nd:'N5 + N6',t:40},{id:'Z4',nm:'Detoxification Trident',nd:'N2 + N4',t:40},{id:'Z5',nm:'Hormonal Terrain Axis',nd:'N3 + N4 + N6',t:32}],
      stacks=[{id:'S1',f:'Z2',t:'Z1',sh:'Gut drives thyroid',ti:'EMERGING',tc:'#5F7C6C',n:'Mechanism Established, cascade Emerging (D-06)'},{id:'S2',f:'Z1',t:'Z5',sh:'Energy drives hormones',ti:'ESTABLISHED',tc:'#C9A84C',n:''},{id:'S3',f:'Z4',t:'Z1',sh:'Detox drives energy',ti:'EMERGING',tc:'#5F7C6C',n:''},{id:'S4',f:'Z5',t:'Z2',sh:'Hormones drive resilience',ti:'THEORETICAL',tc:'#C0392B',n:'Excluded from DRD trace (D-12). Still fires for display.',s4:1},{id:'S5',f:'Z2',t:'Z3',sh:'Gut drives heart',ti:'EMERGING',tc:'#5F7C6C',n:'Upgrade trigger: TMAO meta-analysis (D-08)'},{id:'S6',f:'Z1',t:'Z3',sh:'Energy drives heart',ti:'ESTABLISHED',tc:'#C9A84C',n:'',s6:1}],
      outputs=[{nm:'CascadeAtlas',d:'Complete five-zone six-stack architecture diagram'},{nm:'COHERENCE',d:'Autonomic rhythm cross-zone detection (Z1, Z2, Z3)'},{nm:'CascadeIQ',d:'Composite cascade intelligence score'},{nm:'CZR',d:'Convergence Zone Report: full structured clinical record'},{nm:'CIB',d:'Clinical Intelligence Brief: in-consultation summary'}],
      consts=[{l:'Nodes',v:'7',n:'N1-N7. MES = context.',c:'#1A7A8A'},{l:'Zones',v:'5',n:'Z1-Z5. Z6+ = error.',c:'#C9A84C'},{l:'Stacks',v:'6',n:'S4 Theoretical.',c:'#7B5EA7'},{l:'N6 Dampening',v:'0.7x',n:'Zone avg + floor.',c:'#5F7C6C'}];
  function arrow(i){return '<div class="la3-ar" id="vm-la3-arrow-'+i+'"><div class="la3-al"></div><div class="la3-ah"></div><span class="la3-at">feeds</span></div>';}
  function buildL1(){
    var h='<div class="la3-nds">';
    nodes.forEach(function(nd){
      var n6=nd.id==='N6',n7=nd.id==='N7';
      h+='<div class="la3-nd"><div class="la3-nc'+(n6?' n6':'')+'">'+nd.id+'</div><div class="la3-nn">'+nd.nm+'</div><div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:4px">';
      if(n7){h+='<span class="la3-p2">Phase 2</span>';}else{nd.z.forEach(function(z){h+='<span class="la3-zb" style="background:'+ZC[z]+'">'+z+'</span>';});}
      h+='</div>';if(n6)h+='<div class="la3-n6n">Appears in 4 of 5 zones. Dampening coefficient 0.7 applied.</div>';
      h+='</div>';
    });
    h+='</div><div class="la3-mb"><span class="la3-mt">MES: Metabolic Environment and Substrate</span><div class="la3-ms">Cross-cutting context. NOT a node. NOT scored. Foundational context only.</div></div>';
    return h;
  }
  function buildL2(){
    var h='<div class="la3-zs">';
    zones.forEach(function(z){var c=ZC[z.id];h+='<div class="la3-zc" style="border-left:4px solid '+c+';background:'+c+'18"><div class="la3-zi" style="color:'+c+'">'+z.id+': '+z.nm+'</div><div class="la3-zn">Nodes: '+z.nd+'</div><div class="la3-zt">Activation: >= '+z.t+'</div><div class="la3-zst">Active / Borderline / Quiescent (lower display = higher burden)</div>'+(z.id==='Z5'?'<div class="la3-z5n">Lower threshold reflects hormonal terrain sensitivity</div>':'')+'</div>';});
    return h+'</div>';
  }
  function buildL3(){
    var h='<div class="la3-ss">';
    stacks.forEach(function(s){
      var tc=s.s4?'#fff':(s.ti==='ESTABLISHED'?'#0D2B4E':'#fff');
      h+='<div class="la3-sr'+(s.s4?' s4':'')+'"><div class="la3-si">'+s.id+'</div><div class="la3-sd"><span style="color:'+ZC[s.f]+'">'+s.f+'</span><span class="la3-sa"> &#8594; </span><span style="color:'+ZC[s.t]+'">'+s.t+'</span></div><div class="la3-sx"><div class="la3-sh">'+s.sh+'</div><span class="la3-tb" style="color:'+tc+';background:'+s.tc+'">'+s.ti+'</span>';
      if(s.s6)h+=' <span class="la3-ub">UNIDIRECTIONAL</span>';
      if(s.n)h+='<div class="la3-sn">'+s.n+'</div>';
      h+='</div></div>';
    });
    h+='</div><div class="la3-tl"><div class="la3-tlh">TerrainLock: Self-Perpetuating Loop</div><div class="la3-tp"><span class="la3-tz" style="color:#1A7A8A;background:rgba(26,122,138,.12);border-color:rgba(26,122,138,.25)">Z2</span><span class="la3-ta">&#8594;</span><span class="la3-tz" style="color:#C9A84C;background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.25)">Z1</span><span class="la3-ta">&#8594;</span><span class="la3-tz" style="color:#2E6DB4;background:rgba(212,184,112,.12);border-color:rgba(212,184,112,.25)">Z5</span><span class="la3-ta">&#8594;</span><span class="la3-tz" style="color:#1A7A8A;background:rgba(26,122,138,.12);border-color:rgba(26,122,138,.25)">Z2</span><span style="font-size:16px;color:#C9A84C;margin-left:4px">&#8635;</span></div><div style="font-size:12px;margin-bottom:4px">Z2 gut restoration is the default tiebreaker entry point.</div><div style="font-size:10px;color:var(--vm-muted);font-family:\'DM Mono\',monospace">Activation: S1 Active + S2 Active + (S4 Active OR both Z5 and Z2 internal >= 60)</div></div>';
    return h;
  }
  function buildL4(){
    return '<div class="la3-dp"><p>Driver-Reactor Designation identifies which zone is driving the clinical picture.</p><div class="la3-dc" style="background:rgba(123,94,167,.09);border-left:3px solid #7B5EA7">Driver = Driver (Phase 1 display: "Driver")</div><p style="font-size:12px;color:var(--vm-muted)">Z5 is almost always Reactor, rarely Driver.</p><div class="la3-dc" style="background:rgba(192,57,43,.08);border-left:3px solid #C0392B">S4 (THEORETICAL) excluded from DRD cascade tracing. S6 (Established) is UNIDIRECTIONAL: Z1 to Z3 only. DRD trace only follows Established and Emerging stacks (D-12).</div><p style="font-size:11px;color:var(--vm-muted);line-height:1.6;margin-bottom:0">Evidence tier of the informing cascade stack is displayed alongside each designation (D-14).</p></div>';
  }
  function buildL5(){
    var h='<div style="font-size:12px;color:var(--vm-muted);margin-bottom:12px;font-style:italic">Assessment Priority and Evidence Xray. Three budget tiers.</div><div class="la3-ao">';
    outputs.forEach(function(o){h+='<div class="la3-arow"><span class="la3-an">'+o.nm+'</span><span class="la3-ad">'+o.d+'</span></div>';});
    return h+'</div>';
  }
  var renderers=[buildL1,buildL2,buildL3,buildL4,buildL5],wrap=document.getElementById('vm-la3-layers'),html='';
  layers.forEach(function(ly,i){
    html+='<div class="la3-ly" id="vm-la3-layer-'+ly.id+'" data-idx="'+i+'"><div class="la3-hd" onclick="vmLa3Toggle('+i+')"><div class="la3-bg" style="border-color:'+LC[i]+';color:'+LC[i]+';background:rgba(255,255,255,0.08)">'+ly.id+'</div><div style="flex:1"><div class="la3-tt">'+ly.title+'</div><div class="la3-q" style="color:'+LC[i]+'">'+ly.q+'</div></div><span class="la3-ch" style="color:'+LC[i]+'">&#9660;</span></div><div class="la3-ct"><div class="la3-in">'+renderers[i]()+'</div></div></div>';
    if(i<4)html+=arrow(i);
  });
  wrap.innerHTML=html;
  var ce=document.getElementById('vm-la3-constants'),ch='';
  consts.forEach(function(it){ch+='<div class="la3-cc" style="background:'+it.c+'15;border-color:'+it.c+'40"><div class="la3-cv" style="color:'+it.c+'">'+it.v+'</div><div class="la3-cl" style="color:'+it.c+'">'+it.l+'</div><div class="la3-cn">'+it.n+'</div></div>';});
  ce.innerHTML=ch;
  window.vmLa3Toggle=function(idx){
    var els=document.querySelectorAll('#vm-la3-layers .la3-ly');
    els.forEach(function(el,i){var bg=el.querySelector('.la3-bg');if(i===idx&&!el.classList.contains('open')){el.classList.add('open');bg.style.backgroundColor=LC[i];bg.style.color='#fff';}else{el.classList.remove('open');bg.style.backgroundColor='rgba(255,255,255,0.08)';bg.style.color=LC[i];}});
  };
  var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('revealed');obs.unobserve(e.target);}});},{threshold:.15});
  document.querySelectorAll('.vm-reveal').forEach(function(el){obs.observe(el);});
})();
</script>
