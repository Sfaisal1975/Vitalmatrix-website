<!-- VOLTERRAIN Living Architecture — Layer 0: Upstream Driver Panel -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  #vm-volterrain-section{background:#0D2B4E;color:#E8EDF3;padding:64px 24px;font-family:'Outfit',sans-serif}
  #vm-volterrain-section *{box-sizing:border-box;margin:0;padding:0}
  .vm-volterrain-eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#5A9FD4;margin-bottom:8px}
  .vm-volterrain-heading{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:#FFFFFF;margin-bottom:6px}
  .vm-volterrain-phase{font-family:'DM Mono',monospace;font-size:10px;color:#7A8FA6;margin-bottom:32px;max-width:680px;line-height:1.5}
  .vm-volterrain-bio-bar{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding:12px 16px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(0,0,0,.18)}
  .vm-volterrain-bio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .vm-volterrain-bio-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px}
  .vm-volterrain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:36px}
  .vm-volterrain-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 18px}
  .vm-volterrain-chip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .vm-volterrain-chip-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;color:#FFFFFF}
  .vm-volterrain-badge{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.25)}
  .vm-volterrain-badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .vm-volterrain-score-row{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
  .vm-volterrain-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#1A3A5C;outline:none}
  .vm-volterrain-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#5A9FD4;cursor:pointer}
  .vm-volterrain-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#5A9FD4;border:none;cursor:pointer}
  .vm-volterrain-slider[disabled]{opacity:.35;cursor:not-allowed}
  .vm-volterrain-slider[disabled]::-webkit-slider-thumb{cursor:not-allowed}
  .vm-volterrain-score-val{font-family:'DM Mono',monospace;font-size:12px;min-width:24px;text-align:right;color:#9BB8D4}
  .vm-volterrain-nodes{font-family:'DM Mono',monospace;font-size:10px;color:#5A7A96;margin-top:4px}
  .vm-volterrain-evidence{font-family:'DM Mono',monospace;font-size:9px;color:#4A6A86;margin-top:2px}
  .vm-volterrain-pending{font-family:'DM Mono',monospace;font-size:9px;color:#1A5490;background:rgba(26,84,144,.15);padding:2px 7px;border-radius:10px;display:inline-block;margin-top:6px}
  .vm-volterrain-mes{margin-top:8px;padding:18px;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:rgba(0,0,0,.12);text-align:center}
  .vm-volterrain-mes-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5A9FD4;margin-bottom:6px}
  .vm-volterrain-arrow{font-family:'DM Mono',monospace;font-size:18px;color:#3A6A8E;margin:4px 0}
  .vm-volterrain-mes-flow{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
  .vm-volterrain-flow-node{font-family:'DM Mono',monospace;font-size:11px;color:#7A9AB6;padding:4px 10px;border:1px solid rgba(255,255,255,.08);border-radius:6px}
</style>

<section id="vm-volterrain-section">
  <p class="vm-volterrain-eyebrow">Layer 0: Upstream Intelligence</p>
  <h2 class="vm-volterrain-heading">VOLTERRAIN Driver Panel</h2>
  <p class="vm-volterrain-phase">Phase 1 specification only. Build deferred to Phase 1.5. W26 PROPOSED, SPECULATIVE pending SA D-series ruling.</p>

  <div class="vm-volterrain-bio-bar">
    <span class="vm-volterrain-bio-dot" id="vm-volterrain-bio-dot"></span>
    <span class="vm-volterrain-bio-label" id="vm-volterrain-bio-text">BIOELECTRICAL CONTEXT: --</span>
  </div>

  <div class="vm-volterrain-grid" id="vm-volterrain-grid"></div>

  <div class="vm-volterrain-mes">
    <p class="vm-volterrain-mes-label">MES Upstream Indicator</p>
    <div class="vm-volterrain-arrow">|</div>
    <div class="vm-volterrain-arrow">V</div>
    <div class="vm-volterrain-mes-flow">
      <span class="vm-volterrain-flow-node">VOLTERRAIN L0</span>
      <span style="color:#3A6A8E;font-family:'DM Mono',monospace">--></span>
      <span class="vm-volterrain-flow-node">FLINT L1</span>
      <span style="color:#3A6A8E;font-family:'DM Mono',monospace">--></span>
      <span class="vm-volterrain-flow-node">L2</span>
      <span style="color:#3A6A8E;font-family:'DM Mono',monospace">--></span>
      <span class="vm-volterrain-flow-node">L3</span>
      <span style="color:#3A6A8E;font-family:'DM Mono',monospace">--></span>
      <span class="vm-volterrain-flow-node">L4</span>
      <span style="color:#3A6A8E;font-family:'DM Mono',monospace">--></span>
      <span class="vm-volterrain-flow-node">L5</span>
    </div>
  </div>
</section>

<script>
(function(){
  var drivers=[
    {id:"D1",name:"Redox Signalling State",nodes:["N2","N3","N4"],ev:"ESTABLISHED / EMERGING",score:58,locked:false},
    {id:"D2",name:"Circulation and Oxygen Delivery",nodes:["N3","N5"],ev:"ESTABLISHED / EMERGING",score:35,locked:false},
    {id:"D3",name:"Mitochondrial Function",nodes:["N3"],ev:"ESTABLISHED / EMERGING",score:62,locked:false},
    {id:"D4",name:"pH Context",nodes:["N1","N2","N3","N4","N5","N6","N7"],ev:"ESTABLISHED / EMERGING",score:38,locked:false},
    {id:"D5",name:"EMF Exposure",nodes:["N6","N7"],ev:"CONTESTED",score:0,locked:true},
    {id:"D6",name:"Mycotoxin and Mould Exposure",nodes:["N2","N4"],ev:"ESTABLISHED / EMERGING",score:22,locked:false},
    {id:"D7",name:"Circadian Rhythm Disturbance",nodes:["N3","N6"],ev:"ESTABLISHED / EMERGING",score:55,locked:false}
  ];
  var grid=document.getElementById("vm-volterrain-grid");

  function statusFor(s){
    if(s>=50)return{label:"Active",color:"#B83232"};
    if(s>=25)return{label:"Suspected",color:"#B86F00"};
    return{label:"Absent",color:"#1F7A3A"};
  }

  function updateBio(){
    var active=0;
    drivers.forEach(function(d){if(d.score>=50)active++;});
    var dot=document.getElementById("vm-volterrain-bio-dot");
    var txt=document.getElementById("vm-volterrain-bio-text");
    var state,col;
    if(active<=1){state="STABLE";col="#1F7A3A";}
    else if(active<=3){state="BORDERLINE";col="#B86F00";}
    else{state="COMPROMISED";col="#B83232";}
    dot.style.background=col;
    txt.textContent="BIOELECTRICAL CONTEXT: "+state+" ("+active+"/7 active)";
    txt.style.color=col;
  }

  drivers.forEach(function(d,i){
    var st=statusFor(d.score);
    var chip=document.createElement("div");
    chip.className="vm-volterrain-chip";
    chip.id="vm-volterrain-chip-"+d.id;
    var h='<div class="vm-volterrain-chip-head">';
    h+='<span class="vm-volterrain-chip-name">'+d.id+" "+d.name+"</span>";
    h+='<span class="vm-volterrain-badge" id="vm-volterrain-badge-'+d.id+'">';
    h+='<span class="vm-volterrain-badge-dot" id="vm-volterrain-dot-'+d.id+'" style="background:'+st.color+'"></span>';
    h+='<span id="vm-volterrain-lbl-'+d.id+'">'+st.label+"</span></span></div>";
    h+='<div class="vm-volterrain-score-row">';
    h+='<input type="range" min="0" max="100" value="'+d.score+'" class="vm-volterrain-slider" id="vm-volterrain-sl-'+d.id+'"'+(d.locked?" disabled":"")+">";
    h+='<span class="vm-volterrain-score-val" id="vm-volterrain-val-'+d.id+'">'+d.score+"</span></div>";
    h+='<p class="vm-volterrain-nodes">Nodes: '+d.nodes.join(", ")+"</p>";
    h+='<p class="vm-volterrain-evidence">Evidence: '+d.ev+"</p>";
    if(d.locked)h+='<span class="vm-volterrain-pending">Phase 1.5 pending</span>';
    chip.innerHTML=h;
    grid.appendChild(chip);

    if(!d.locked){
      document.getElementById("vm-volterrain-sl-"+d.id).addEventListener("input",function(e){
        var v=parseInt(e.target.value);
        drivers[i].score=v;
        document.getElementById("vm-volterrain-val-"+d.id).textContent=v;
        var s=statusFor(v);
        document.getElementById("vm-volterrain-dot-"+d.id).style.background=s.color;
        document.getElementById("vm-volterrain-lbl-"+d.id).textContent=s.label;
        updateBio();
      });
    }
  });
  updateBio();
})();
</script>
