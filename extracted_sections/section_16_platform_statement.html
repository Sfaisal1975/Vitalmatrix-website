<section class="vm-reveal" id="statement-section" aria-label="Platform statement" style="background:#1E1A2E; padding:120px 0; text-align:center; position:relative; overflow:hidden;">
  <!-- Subtle radial glow behind text -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(201,168,76,0.04) 0%,transparent 65%);pointer-events:none;z-index:0;"></div>
  <div class="container-sm" style="position:relative;z-index:1;">
    <!-- Line 1: types out with cursor -->
    <p id="stmt-line1" style="font-family:var(--vm-fs);font-size:clamp(28px,4vw,48px);font-weight:300;color:var(--vm-white);line-height:1.25;max-width:700px;margin:0 auto;min-height:1.5em;">
      <span id="stmt-typed"></span><span id="stmt-cursor" style="display:inline-block;width:2px;height:0.8em;background:rgba(201,168,76,0.7);margin-left:4px;vertical-align:baseline;animation:cursorBlink 1s step-end infinite;"></span>
    </p>
    <!-- Line 2: fades in after pause -->
    <p id="stmt-line2" style="font-family:var(--vm-fs);font-size:clamp(28px,4vw,48px);font-weight:300;color:var(--vm-gold);font-style:italic;line-height:1.25;max-width:700px;margin:16px auto 0;opacity:0;transform:translateY(12px);transition:opacity 0.8s ease, transform 0.8s ease, text-shadow 0.8s ease;">
      It removes everything that was getting in the way of it.
    </p>
  </div>
</section>
